name: Discord Release Announcement

on:
  release:
    types: [published, edited]

jobs:
  discord-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Release Embed to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          script: |
            const release = context.payload.release;
            const webhookUrl = process.env.DISCORD_WEBHOOK;
            if (!webhookUrl) {
              core.setFailed("DISCORD_WEBHOOK secret bulunamadı!");
              return;
            }

            // Metni al ve görsel/HTML etiketlerini temizle
            let body = (release.body || "")
              .replace(/<img[^>]*>/gi, "")
              .replace(/!\[.*?\]\(.*?\)/gi, "")
              .trim();

            if (body.length > 500) {
              body = body.substring(0, 500) + "\n\n... (Devamı GitHub Release sayfasında)";
            }

            const payload = {
              username: "serto_autoservices",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: release.name || release.tag_name,
                  url: release.html_url,
                  color: 65386,
                  description: body || "Yeni sürüm yayınlandı.",
                  fields: [
                    { name: "Sürüm", value: `\`${release.tag_name}\``, inline: true },
                    { name: "Geliştirici", value: context.actor, inline: true }
                  ],
                  footer: {
                    text: "Serto Auto Service • System Ecosystem"
                  }
                }
              ]
            };

            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const err = await response.text();
              core.setFailed(`Discord bildirim hatası: ${err}`);
            }
